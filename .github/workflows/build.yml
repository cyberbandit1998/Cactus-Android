name: build

# Compiles the whole project on the same OS family the app is developed on (Windows) and on Linux,
# runs the unit tests, fetches the official Needle engine, links it into the app, and keeps the
# debug APK as a build artifact. GitHub-hosted runners have the Android SDK and internet access.
# Device and emulator tests are NOT run here: the engine is arm64-only and needs a real phone.

on:
  push:
    # Committing the finished APK to dist/ must not start another build.
    paths-ignore:
      - 'dist/**'
  pull_request:
  workflow_dispatch:
    inputs:
      commit_apk:
        description: 'After a green build, commit the Windows-built debug APK to dist/ on this branch'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests for :core (includes the JNI marshalling tests against the test double)
        run: ./gradlew :core:test --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          retention-days: 7

  android:
    name: debug APK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      # GitHub-hosted runners already contain the Android SDK; AGP downloads the missing NDK/CMake
      # pieces once the licences are accepted.
      - name: Accept Android SDK licences
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager* 2>/dev/null | head -1 || true)"; fi
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then yes | "$SDKM" --licenses > /dev/null || true; fi
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/ndk" 2>/dev/null || true

      - name: Fetch the Needle engine (Linux)
        if: runner.os != 'Windows'
        run: scripts/fetch-engine.sh
      - name: Fetch the Needle engine (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\fetch-engine.ps1

      - name: Build debug APK, compile the device tests, lint, unit tests and an unsigned release build
        shell: bash
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Inspect the engine (compare its real header and symbols with native/shim/needle_abi.h)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          NM="$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm 2>/dev/null | tail -1)"
          LIB=native-engine/android-arm64/libneedle.a
          echo "==== exported C API of libneedle.a"
          "$NM" -g --defined-only "$LIB" 2>/dev/null | grep -E ' T needle_' | sort -u || true
          echo "==== C-level functions libneedle.a expects from the system (no C++ names)"
          "$NM" -g -u "$LIB" 2>/dev/null | grep -v ' _Z' | awk '{print $2}' | sort -u | tr '\n' ' ' || true
          echo
          echo "==== networking / process / dynamic-loading functions imported by libneedle.a (C names only; 'none found' = none)"
          "$NM" -g -u "$LIB" 2>/dev/null | grep -v ' _Z' | awk '{print $2}' | grep -Ex '(socket|connect|bind|listen|accept|send|sendto|sendmsg|recv|recvfrom|recvmsg|getaddrinfo|gethostbyname|getifaddrs|res_.*|dlopen|dlsym|popen|system|execv.*|execl.*|fork|vfork|posix_spawn.*|syscall|curl_.*|SSL_.*)' || echo "none found"
          echo "==== URLs embedded in libneedle.a (empty result = none found)"
          strings -a "$LIB" | grep -Eio 'https?://[^ "]{4,80}' | sort -u | head -30 || true
          echo "(end)"

      - name: Check the model hosting (metadata only, nothing large is downloaded)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          for pair in "Cactus-Compute/needle3 needle3.cact" "Cactus-Compute/whistle whistle.cact"; do
            set -- $pair
            repo=$1
            file=$2
            echo "==== $repo / $file"
            echo "-- repository listing (what the app reads to get size and SHA-256)"
            curl -fsSL "https://huggingface.co/api/models/$repo/tree/main" | python3 -c '
          import json, sys
          for e in json.load(sys.stdin):
              lfs = e.get("lfs") or {}
              print(e.get("type"), e.get("path"), "size", e.get("size"), "lfs.size", lfs.get("size"), "lfs.oid", (lfs.get("oid") or "")[:16])
          '
            echo "-- first answer to the download URL (headers only)"
            curl -sI "https://huggingface.co/$repo/resolve/main/$file" | grep -iE '^(HTTP|location|x-linked-etag|x-linked-size|content-length)' || true
            echo "-- where the download is redirected to, and whether it accepts a byte range (1 byte requested)"
            curl -sL -D - -o /dev/null -r 0-0 "https://huggingface.co/$repo/resolve/main/$file" | grep -iE '^(HTTP|location|content-range|accept-ranges)' | sed -E 's/(location: https:\/\/[^\/?]+).*/\1 ... (signed address omitted)/I' || true
            echo "-- licence: first lines of the repository LICENSE file"
            curl -fsSL "https://huggingface.co/$repo/resolve/main/LICENSE" | head -4 || true
            echo "-- model card header (licence, tags)"
            curl -fsSL "https://huggingface.co/$repo/resolve/main/README.md" | head -25 || true
          done

      - name: Lint summary
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          p = 'app/build/reports/lint-results-debug.xml'
          if not os.path.exists(p):
              print('no lint XML found')
              raise SystemExit
          rows = []
          for issue in ET.parse(p).getroot().iter('issue'):
              loc = issue.find('location')
              where = ''
              if loc is not None:
                  where = loc.get('file', '').split('Cactus-Android/')[-1] + ':' + loc.get('line', '')
              rows.append((issue.get('severity', ''), issue.get('id', ''), issue.get('message', '')[:150], where))
          print(len(rows), 'lint issues')
          for r in sorted(rows):
              print(' | '.join(r))
          PY

      - name: Inspect the APK (package, SDK levels, ABI, permissions, signature, checksum)
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          echo "build-tools: $BT"
          "$BT/aapt2" dump badging dist/CactusAI-debug.apk | grep -E "^(package:|sdkVersion|minSdkVersion|targetSdkVersion|native-code|uses-permission|application-label:|launchable-activity)" || true
          echo "---- signature"
          "$BT/apksigner" verify --verbose dist/CactusAI-debug.apk 2>&1 | head -8 || true
          echo "---- native libraries inside the APK"
          unzip -l dist/CactusAI-debug.apk | grep -E "lib/" || true
          echo "---- sha256"
          sha256sum dist/CactusAI-debug.apk

      - name: Show the APK
        shell: bash
        run: |
          ls -la dist/
          unzip -l dist/CactusAI-debug.apk | grep -E 'lib/|classes|AndroidManifest' || true

      - uses: actions/upload-artifact@v4
        with:
          name: CactusAI-debug-apk-${{ runner.os }}
          path: dist/CactusAI-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports-${{ runner.os }}
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests
          retention-days: 7

  # Manual only (Run workflow -> tick "commit_apk"). The APK is built on the Windows runner by the job above and
  # committed unchanged, so that dist/CactusAI-debug.apk exists in the repository for `adb install -r`.
  commit-apk:
    name: commit the Windows-built APK to dist/
    if: github.event_name == 'workflow_dispatch' && inputs.commit_apk
    needs: [core, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CactusAI-debug-apk-Windows
          path: dist
      - name: Commit dist/CactusAI-debug.apk and dist/BUILD-INFO.txt
        env:
          BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          sum="$(sha256sum dist/CactusAI-debug.apk | cut -d' ' -f1)"
          size="$(stat -c %s dist/CactusAI-debug.apk)"
          {
            echo "CactusAI-debug.apk"
            echo "  built by:    GitHub Actions, windows-latest runner (Gradle :app:assembleDebug)"
            echo "  run:         $RUN_URL"
            echo "  source:      commit $SOURCE_SHA"
            echo "  built at:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "  size:        $size bytes"
            echo "  sha256:      $sum"
            echo "  signed with: the runner's throwaway Android debug key (not a release key)"
            echo "  contains:    the Needle engine (Apache-2.0 as declared by its Hugging Face repository), arm64-v8a only"
            echo "  tested on:   no phone. It was compiled and inspected only; see docs/DEVICE_TEST_CHECKLIST.md"
          } > dist/BUILD-INFO.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/CactusAI-debug.apk dist/BUILD-INFO.txt
          git commit -m "Add the Windows-built debug APK (dist/CactusAI-debug.apk)" \
            -m "Built by CI from commit $SOURCE_SHA, see dist/BUILD-INFO.txt. Not tested on a phone." \
            -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_01PjWzmT2SfxsVsHpWiimmrG"
          git push origin "HEAD:$BRANCH"
