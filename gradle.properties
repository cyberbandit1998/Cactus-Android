org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The app refuses to build without the Needle engine library (see scripts/fetch-engine.*).
# CI uses -Pcactusai.allowMissingEngine=true ONLY for compile/lint/unit-test checks; such a build
# has no AI engine inside and must never be installed or distributed as the assistant.
cactusai.allowMissingEngine=false
